stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - data/external/swiggy.csv
    - src/data/data_ingestion.py
    outs:
    - data/raw/swiggy_cleaned.csv
  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/raw/swiggy_cleaned.csv
    - src/data/data_preprocessing.py
    params:
    - data_preprocessing.random_state
    - data_preprocessing.test_size
    outs:
    - data/interim/test.csv
    - data/interim/train.csv
  feature_engineering:
    cmd: python src/features/feature_engineering.py
    deps:
    - data/interim/test.csv
    - data/interim/train.csv
    - src/features/feature_engineering.py
    outs:
    - data/processed/test_trans.csv
    - data/processed/train_trans.csv
    - models/preprocessor.pkl
  baseline_model:
    cmd: python src/models/baseline_model.py
    deps:
    - data/processed/test_trans.csv
    - data/processed/train_trans.csv
    - src/models/baseline_model.py
